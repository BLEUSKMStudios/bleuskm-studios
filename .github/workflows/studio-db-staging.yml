# Applies Studio OS database migrations to the Supabase STAGING project.
#
# Runs when migration files change on main or the Studio OS development
# branch. On the development branch the deploy job runs only for a commit whose
# message contains [db-staging], so nothing is attempted before the protected
# environment exists. The permission tests must pass first, and the deploy job then waits
# in the protected "supabase-staging" environment until Zaria approves it
# (GitHub: "Review deployments"). The credentials live only in that
# environment and are released only after approval.
name: Studio OS database (staging)

on:
  push:
    branches:
      - main
      - claude/project-thread-75yn22
    paths:
      - "studio/supabase/migrations/**"
      - ".github/workflows/studio-db-staging.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-staging
  cancel-in-progress: false

jobs:
  test:
    name: Database permission tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: supabase/postgres:17.6.1.054
        env:
          # Throwaway database for this run only; the value is generated per run.
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h localhost"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install psql and pg_prove
        run: sudo apt-get update -q && sudo apt-get install -y -q postgresql-client libtap-parser-sourcehandler-pgtap-perl
      - name: Apply migrations and run the pgTAP tests
        run: studio/supabase/scripts/test-database.sh

  deploy:
    name: Apply migrations to staging (needs approval)
    needs: test
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      contains(github.event.head_commit.message, '[db-staging]')
    runs-on: ubuntu-latest
    environment: supabase-staging
    defaults:
      run:
        working-directory: studio
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1
      - name: Check the environment is configured
        run: |
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF; do
            if [ -z "${!v}" ]; then echo "::error::$v is not set in the supabase-staging environment"; exit 1; fi
          done
      - name: Link the staging project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Show pending migrations
        run: supabase migration list
      - name: Apply migrations
        run: supabase db push
      - name: Show applied migrations
        run: supabase migration list
